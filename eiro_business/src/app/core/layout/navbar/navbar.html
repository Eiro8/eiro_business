<header class="header">
  <div class="brand">
    <img src="" alt=""/>
    <span>
      <p>{{brand.name}}</p>
    </span>
  </div>

  <nav class="nav">
    <ul class="link_list">
      @for (link of links; track link.label){
      <li class="link_wrap">
        <a [routerLink]="link.route" routerLinkActive="active-link" class="link">{{link.label}}</a>
      </li>
      }
    </ul>
  </nav>
  <div class="interactible">
    <button>TEMA</button>
    <button>ACESSIBILIDADE</button>
    <button>LOGIN</button>
  </div>
</header>
