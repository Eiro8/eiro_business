<section class="navbar">
  <div class="brand">
    <img [src]="logo_url" [alt]="name" />
    <span class="title">{{name}}</span>
  </div>
  <div class="links">
    <ul>
      @for (link of links; track link.label){
      <li class="link"><a [routerLink]="link.route">{{link.label}}</a></li>
      }@empty {
      <li>Não há páginas disponíveis</li>
      }
    </ul>
  </div>
  <div class="interact">
  </div>
</section>
